name: Android CI

# Build, lint and test md for Android on every push / PR: the debug build, Android
# Lint, the JVM unit tests, and the instrumented tests on an emulator at both ends
# of the supported range — Android 12 (minSdk 31) and Android 16 (targetSdk 36).

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Gradle 9.6 / AGP 9.4 need JDK 21 to run; the app's bytecode still targets 17.
# -PnoBump everywhere keeps CI from rewriting the tracked version.properties.

jobs:
  build:
    name: Build (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        run: ./gradlew :md:assembleDebug :md:assembleDebugAndroidTest --no-daemon -PnoBump

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android Lint
        run: ./gradlew :md:lintDebug --no-daemon -PnoBump
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: md/build/reports/lint-results-*.html
          if-no-files-found: ignore

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM unit tests
        run: ./gradlew :md:testDebugUnitTest --no-daemon -PnoBump
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: md/build/reports/tests/**
          if-no-files-found: ignore

  instrumented:
    # The tests that need a real WebView, a real BasicTextField and real key
    # events — the ones that found the preview's retry and scroll bugs. The
    # Android 12 image carries the WebView it shipped with (91); the one
    # assertion that depends on a newer one says so in the test.
    name: Instrumented (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [ 31, 36 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The emulator needs hardware acceleration; GitHub's Linux runners offer
      # KVM once the runner user may open it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and test APKs
        run: ./gradlew :md:assembleDebug :md:assembleDebugAndroidTest --no-daemon -PnoBump
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew :md:connectedDebugAndroidTest --no-daemon -PnoBump
      - name: Upload instrumented report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report-api-${{ matrix.api }}
          path: md/build/reports/androidTests/**
          if-no-files-found: ignore
